version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Match pnpm's minimumReleaseAge: only propose versions at least 5 days old.
    cooldown:
      default-days: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # PR titles become squash commit subjects; keep them conventional.
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci
      include: scope
