version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Match pnpm's minimumReleaseAge: only propose versions at least 5 days old.
    cooldown:
      default-days: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # @stacks/clarinet-sdk depends on an exact @stacks/transactions version.
    # Bump ours by hand to the version clarinet-sdk uses, so a single copy is
    # installed. Only version updates are ignored; security updates still open.
    ignore:
      - dependency-name: "@stacks/transactions"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # PR titles become squash commit subjects; keep them conventional.
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci
      include: scope
