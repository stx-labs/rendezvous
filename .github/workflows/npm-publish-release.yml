name: npm-publish
on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    environment: "Publish to NPM"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # setup-node never caches pnpm unless asked; stating it keeps zizmor's
      # cache-poisoning audit quiet for a job with publish access.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter .
      - run: pnpm test
      - run: pnpm run build
      # Trusted publishing (OIDC) authenticates. Earlier releases carry
      # provenance, so require it: consumers with trustPolicy: no-downgrade
      # would refuse a release without it.
      - name: Publish
        run: |
          # Keep RCs off the `latest` dist-tag so plain `npm install` still
          # resolves to the latest stable release.
          if [[ "${GITHUB_REF_NAME}" == *-rc* ]]; then
            pnpm publish --provenance --tag rc --no-git-checks
          else
            pnpm publish --provenance --no-git-checks
          fi
